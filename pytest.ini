[pytest]
testpaths = tests
# `delta` marks tests needing a Delta runtime. Delta requires Hadoop native
# libraries, which on Windows means winutils.exe, so these run on the Linux CI
# runners and skip themselves elsewhere. Run just them with `-m delta`, or
# everything else with `-m "not delta"`.
markers =
    delta: requires a Delta Lake runtime (Linux/CI)
filterwarnings =
    ignore::DeprecationWarning
